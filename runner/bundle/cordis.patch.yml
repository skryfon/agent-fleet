# dsh-bundle-agentfleet — stacks the af-* plugins over dsh-base + dsh-headless
# to form the agentfleet-runner profile (development-plan.md §5, §7).
#
# M1: af-policy, af-github, and af-worktree are real plugins. M3: af-control,
# af-ask-human, and af-resume join them. M4: af-budget joins them. M5:
# af-subagent joins them (spawn_worker/report_to_orchestrator/check_workers/
# report_deviation). af-context (D8 hash-pinned spec_refs) joins them too,
# enabled — AF_SPEC_REFS/AGENTFLEET_WORKTREE_DIR unset (a bare host run, or
# a task with no spec_refs) makes it a no-op, same fallback shape as
# af-worktree's own config. af-webhook stays disabled — the plan calls it
# optional for M6 (development-plan.md §7).
#
# The kill criterion (development-plan.md M1: a deny from af-policy must not
# require patching dsh-base) is proven — see runner/README.md.
#
# af-resume/headless-runner are mutually exclusive boot paths, both gated on
# the SAME env var so they can never both mount: AF_RESUME_SESSION_ID set
# means a resurrect-and-resume launch (M3, internal/supervisor.RunLaunch),
# unset means an ordinary fresh launch. Both dsh-headless rows disable
# together — headless-startup parses the TASK cmdline positional and
# `program.error()`s (process-exiting) on an empty one independently of
# whether headless-runner itself is mounted, so disabling only the runner
# would still crash a resume boot before af-resume ever ran. Both rows
# belong to dsh-bundle-headless, not dsh-base — patching them here from our
# own bundle is the sanctioned pattern (D14: "everything AgentFleet-specific
# lives in our own bundle"), not the dsh-base row patch D14 gates.
- id: headless-startup
  disabled: !!js Boolean(process.env.AF_RESUME_SESSION_ID)

- id: headless-runner
  disabled: !!js Boolean(process.env.AF_RESUME_SESSION_ID)

- insert:
    - id: af-control
      name: '@agentfleet/af-control'
      config:
        controlPlaneURL: !!js process.env.CONTROL_PLANE_URL
        runID: !!js process.env.RUN_ID
        runToken: !!js process.env.AF_RUN_TOKEN

    - id: af-context
      name: '@agentfleet/af-context'
      config:
        specRefs: !!js process.env.AF_SPEC_REFS
        worktreeDir: !!js process.env.AGENTFLEET_WORKTREE_DIR

    # baseRepoDir/worktreeDir are unset outside the container (the entrypoint
    # sets them after `git worktree add`); apply() no-ops when either is
    # undefined, so a bare host run stays a plain no-worktree checkout.
    - id: af-worktree
      name: '@agentfleet/af-worktree'
      config:
        baseRepoDir: !!js process.env.AGENTFLEET_BASE_REPO_DIR
        worktreeDir: !!js process.env.AGENTFLEET_WORKTREE_DIR

    - id: af-github
      name: '@agentfleet/af-github'

    - id: af-policy
      name: '@agentfleet/af-policy'

    - id: af-ask-human
      name: '@agentfleet/af-ask-human'

    - id: af-resume
      name: '@agentfleet/af-resume'
      # A bare leading `!` after `!!js ` reads as a second YAML tag
      # ("duplication of a tag property") — verified live. `=== undefined`
      # says the same thing without one.
      disabled: !!js process.env.AF_RESUME_SESSION_ID === undefined
      config:
        resumeSessionID: !!js process.env.AF_RESUME_SESSION_ID
        answer: !!js process.env.AF_RESUME_ANSWER

    - id: af-budget
      name: '@agentfleet/af-budget'
      config:
        # An unquoted `!!js foo ? bar : baz` reads to YAML as a mapping (the
        # `? ` starts a complex map key), not one !!js scalar — verified via
        # the golden, which rendered this as `usdPerMillionTokens: {'[object
        # Object]': undefined}` before the fix. Quoting forces one scalar.
        usdPerMillionTokens: !!js "process.env.AF_BUDGET_USD_PER_MILLION_TOKENS ? Number(process.env.AF_BUDGET_USD_PER_MILLION_TOKENS) : undefined"

    - id: af-subagent
      name: '@agentfleet/af-subagent'

    - id: af-webhook
      name: '@agentfleet/af-webhook'
      disabled: true # optional per development-plan.md §7 M6 — deliberately deferred, not required for M6 done
