# Local development subset of development-plan.md §8's compose topology.
# Zulip is Zulip Cloud (hosted), not a local service — see
# docs/adr/0004-zulip-as-primary-human-channel.md and deploy/zulip/README.md.
# Langfuse was considered for M7 and dropped, not deferred again: the
# append-only `event` table (D1) already is the trace store and
# GET /v1/events already answers what Langfuse would, while Langfuse v3
# needs ClickHouse + Redis + MinIO on what is otherwise a single-machine
# deployment. bridge, egress-proxy joined at their milestones; webapp joined
# at M7 as a static build served by caddy, not its own service.
# Run with Podman (D11): `podman compose -f deploy/compose.yaml up`.
#
# Before `make up`: build the runner image once (`make runner-image`) — the
# supervisor daemon fails a launch with a clear error if it's absent rather
# than pulling implicitly, since it is not itself a compose service (it is
# created dynamically, one container per Run, on the `runners` network
# below).
name: agentfleet

networks:
  edge:
  core:
  runners:
    internal: true # 0009/0011: no path to postgres, zulip, or the podman socket
  egress:

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    networks: [core]
    environment:
      POSTGRES_USER: agentfleet
      POSTGRES_PASSWORD: agentfleet
      POSTGRES_DB: agentfleet
    ports:
      # host 5433: 5432 is commonly already taken by a host-installed postgres
      - "127.0.0.1:5433:5432"
    volumes:
      - agentfleet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfleet"]
      interval: 2s
      timeout: 2s
      retries: 15

  # One-shot: applies deploy/migrations then exits. Removes the local
  # golang-migrate binary from the happy path; `make migrate-up`/`migrate-down`
  # still work directly against DATABASE_URL for anyone who has it installed.
  migrate:
    image: docker.io/migrate/migrate:v4.18.1
    networks: [core]
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      [
        "migrate",
        "-path",
        "/migrations",
        "-database",
        "postgres://agentfleet:agentfleet@postgres:5432/agentfleet?sslmode=disable",
        "up",
      ]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    build:
      context: ..
      dockerfile: deploy/control-plane.Dockerfile
    networks: [core]
    # M6 per-project credentials (development-plan.md §7 M6): every
    # GH_TOKEN_<SLUG> in ../.env reaches this container's environment via
    # env_file, whatever slugs exist — onboarding project N+1 is adding one
    # line to .env and restarting, never a compose.yaml edit. Needed here
    # (not just on supervisor below) so internal/redact.EnvValuesWithPrefix
    # can redact a per-project token from emitted events — see
    # cmd/control-plane/main.go's redactor construction.
    env_file: ../.env
    environment:
      CONTROL_PLANE_ADDR: ":8080"
      DATABASE_URL: postgres://agentfleet:agentfleet@postgres:5432/agentfleet?sslmode=disable
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SUPERVISOR_SECRET: ${SUPERVISOR_SECRET}
      BRIDGE_URL: "http://bridge:8091"
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      ZULIP_STREAM: ${ZULIP_STREAM:-general}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/control-plane", "-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  supervisor:
    build:
      context: ..
      dockerfile: deploy/supervisor.Dockerfile
    networks: [core]
    # M6 per-project credentials — see control-plane's own env_file comment
    # above. Here, cmd/supervisor/main.go's loadConfig sweeps every
    # GH_TOKEN_<SLUG> this brings in to build projectGHTokens, which
    # daemon.spec resolves per launch by project slug.
    env_file: ../.env
    # Rootless Podman (D11): this bind-mounted socket keeps the REAL host
    # uid:gid of whoever owns it — verified live that this rootless setup
    # does not remap bind-mounted file ownership into the container's
    # namespace, so `user: "0:0"` (assuming a container-root -> host-user
    # identity map) got permission denied even after the SELinux relabel
    # below fixed the label half of the problem. PODMAN_SOCKET_UID/GID must
    # be the real uid:gid that owns PODMAN_SOCKET_DIR's socket (`stat -c
    # '%u:%g' $PODMAN_SOCKET_DIR/podman/podman.sock`) — on a plain Linux
    # host this is simply your own uid:gid. distroless-nonroot's baked-in
    # USER is overridden only here.
    user: "${PODMAN_SOCKET_UID:-1000}:${PODMAN_SOCKET_GID:-1000}"
    environment:
      SUPERVISOR_ADDR: ":8090"
      SUPERVISOR_SECRET: ${SUPERVISOR_SECRET}
      CONTROL_PLANE_URL: "http://control-plane:8080"
      PODMAN_SOCKET: "/run/podman/podman.sock"
      RUNNER_IMAGE: ${RUNNER_IMAGE:-agentfleet-runner}
      RUNNER_NETWORK: "agentfleet_runners"
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
      GH_TOKEN: ${GH_TOKEN}
      OMNI_ROUTE_API_KEY: ${OMNI_ROUTE_API_KEY}
      EGRESS_PROXY_URL: "http://egress-proxy:8080"
    # PODMAN_SOCKET_DIR, not XDG_RUNTIME_DIR: podman itself (the CLI running
    # `compose up`) also reads XDG_RUNTIME_DIR for its own state — verified
    # live that setting it to point compose at the socket breaks the podman
    # client itself ("Failed to obtain podman configuration: lstat /run: no
    # such file or directory" on a host where that path isn't real, e.g.
    # macOS). On a real target Linux host, run with
    # `PODMAN_SOCKET_DIR=$XDG_RUNTIME_DIR make up`. Under Podman Desktop's
    # machine VM, this must be the VM-internal rootless user's own runtime
    # dir, not the macOS host's — find it with
    # `podman machine ssh -- systemctl --user status podman.socket`.
    # `:z` (shared SELinux relabel): on an SELinux-enforcing host the
    # socket's own label (user_tmp_t) isn't one containers can otherwise
    # connect to — verified live as "permission denied" without this, on a
    # host where `getenforce` prints Enforcing. Shared, not `:Z` (exclusive
    # private), since this same socket may be relabeled by other things.
    volumes:
      - ${PODMAN_SOCKET_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock:z
    healthcheck:
      test: ["CMD", "/supervisor", "-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    depends_on:
      control-plane:
        condition: service_healthy

  caddy:
    image: docker.io/library/caddy:2-alpine
    networks: [edge, core]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # M7: the webapp's static build (`make webapp`, run once — same
      # "build before `make up`" convention as runner-image below).
      - ../webapp/dist:/srv/webapp:ro
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - control-plane

  bridge:
    build:
      context: ..
      dockerfile: deploy/bridge.Dockerfile
    networks: [core] # outbound only to Zulip Cloud — no inbound route needed (docs/adr/0004)
    environment:
      BRIDGE_ADDR: ":8091"
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      CONTROL_PLANE_URL: "http://control-plane:8080"
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ZULIP_SITE: ${ZULIP_SITE}
      ZULIP_BOT_EMAIL: ${ZULIP_BOT_EMAIL}
      ZULIP_BOT_API_KEY: ${ZULIP_BOT_API_KEY}
      ZULIP_STREAM: ${ZULIP_STREAM:-general}
    healthcheck:
      test: ["CMD", "/bridge", "-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    depends_on:
      control-plane:
        condition: service_healthy

  # M4 (development-plan.md §8, §4 layer 4): the runner's only route out —
  # `runners` is internal: true (no direct egress), so this is the sole path
  # to api.deepseek.com/GitHub/module proxies, and the sole enforcement
  # point for "no PUT .../pulls/*/merge" that doesn't depend on the runner's
  # own cooperation. `ca/` (bind-mounted, both here and baked into
  # deploy/runner.Dockerfile) is generated once by `make egress-ca` — see
  # deploy/egress-proxy/Dockerfile's own comment on why it isn't
  # regenerated on every restart.
  egress-proxy:
    build:
      context: ./egress-proxy
      dockerfile: Dockerfile
    networks: [runners, egress]
    volumes:
      - ./egress-proxy/ca:/home/mitmproxy/.mitmproxy:z

volumes:
  agentfleet-postgres:
